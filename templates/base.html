<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="static/style.css">
    <title>{% block Title %} Default home page {% endblock %}</title>
</head>
<body>
    <main>
        {% block content %}
        <h1>If you can see this, the details did not render properly</h1>
        <p>Please use the 'contact me' form to report any issues. </p>
        {% endblock %}

        {% block matches %}
        <div class="card matchcard text-white bg-secondary m-3 rounded">
            <div class="card-body">
                <h5 class="card-title">Benneton v Dragons</h5>
                <h6 class="card-subtitle">27th Sept 2026</h6>
                <div class="card-text">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col"></th>
                                <th scope="col" style="min-width:15rem">Team</th>
                                <th scope="col">Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row">Home</th>
                                <td>Benneton</td>
                                <td>5</td>
                            </tr>
                            <tr>
                                <th scope="row">Away</th>
                                <td>Dragons</td>
                                <td>12</td>
                            </tr>
                        </tbody>
                    </table>
                    <p class="text-muted">Scores:</p>
                    <table>
                        <tbody>
                            <tr>
                                <td>Home:</td>
                                <td></td>
                                <td>T</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>Away:</td>
                                <td>T</td>
                                <td></td>
                                <td>C</td>
                                <td>T</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
